services:
  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: nifty
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${D_PREDICT_DATA_DIR:-./data/runtime}/postgres:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./db/migrations/002_prediction_ml.sql:/docker-entrypoint-initdb.d/002-prediction-ml.sql:ro
      - ./db/migrations/003_instrument_metadata.sql:/docker-entrypoint-initdb.d/003-instrument-metadata.sql:ro
      - ./db/migrations/004_canonical_instrument_metadata.sql:/docker-entrypoint-initdb.d/004-canonical-instrument-metadata.sql:ro
      - ./db/migrations/005_ipo_analysis.sql:/docker-entrypoint-initdb.d/005-ipo-analysis.sql:ro
      - ./db/migrations/006_research_data.sql:/docker-entrypoint-initdb.d/006-research-data.sql:ro
      - ./db/migrations/006_seed_instruments.sql:/docker-entrypoint-initdb.d/006-seed-instruments.sql:ro
      - ./db/migrations/007_live_ml_ledger.sql:/docker-entrypoint-initdb.d/007-live-ml-ledger.sql:ro
      - ./db/migrations/008_shadow_trading.sql:/docker-entrypoint-initdb.d/008-shadow-trading.sql:ro
      - ./db/migrations/009_option_paper_trading.sql:/docker-entrypoint-initdb.d/009-option-paper-trading.sql:ro
      - ./db/migrations/010_dpredict_20.sql:/docker-entrypoint-initdb.d/010-dpredict-20.sql:ro
      - ./db/migrations/011_underlying_paper_trading.sql:/docker-entrypoint-initdb.d/011-underlying-paper-trading.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nifty"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    profiles: ["local", "remote"]
    build:
      context: .
      dockerfile: collector/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty}
    restart: unless-stopped

  ml:
    profiles: ["local", "remote"]
    build:
      context: .
      dockerfile: ml-service/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty}
      ML_PORT: 4300
    restart: unless-stopped
    volumes:
      - ${D_PREDICT_DATA_DIR:-./data/runtime}/ml-models:/app/models/live
    ports:
      - "${ML_PORT:-4300}:4300"

  engine:
    profiles: ["local", "remote"]
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty}
      ENGINE_POLL_SECONDS: ${ENGINE_POLL_SECONDS:-60}
      ML_INFERENCE_URL: ${ML_INFERENCE_URL:-http://ml:4300}
    restart: unless-stopped
    command: ["npm", "run", "worker"]

  api:
    profiles: ["local", "remote"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty}
      API_PORT: 4100
    ports:
      - "${API_PORT:-4100}:4100"

  research:
    profiles: ["local", "remote"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty}
      RESEARCH_PORT: 4200
    command: ["node", "dist/research-server.js"]
    ports:
      - "${RESEARCH_PORT:-4200}:4200"
