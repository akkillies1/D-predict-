services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      POSTGRES_DB: nifty
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - nifty-db:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nifty"]
      interval: 5s
      timeout: 5s
      retries: 20

  collector:
    build:
      context: .
      dockerfile: collector/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty
    depends_on:
      postgres:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: engine/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["engine"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-localdev}@postgres:5432/nifty
      API_PORT: 4100
    ports:
      - "${API_PORT:-4100}:4100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nifty-db:
