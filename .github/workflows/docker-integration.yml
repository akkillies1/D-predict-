name: Docker Integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-graph-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create CI environment
        shell: bash
        run: |
          cp .env.example .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://postgres:localdev@localhost:5433/nifty#' .env
          sed -i 's#^D_PREDICT_DATA_DIR=.*#D_PREDICT_DATA_DIR=./data/runtime#' .env
          sed -i 's#^SHADOW_STARTING_CAPITAL=.*#SHADOW_STARTING_CAPITAL=100000#' .env

      - name: Validate Compose configuration
        run: docker compose --profile local config

      - name: Build and start service graph
        run: docker compose --profile local up -d --build postgres api research ml collector engine

      - name: Wait for database and HTTP services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if docker compose exec -T postgres pg_isready -U postgres -d nifty >/dev/null 2>&1; then break; fi
            if [[ "$attempt" == 60 ]]; then docker compose ps; docker compose logs --no-color postgres; exit 1; fi
            sleep 2
          done
          for url in http://127.0.0.1:4100/health http://127.0.0.1:4200/health http://127.0.0.1:4300/health; do
            ready=0
            for attempt in {1..60}; do
              if curl --fail --silent --show-error --max-time 3 "$url" >/tmp/health.json; then
                ready=1
                break
              fi
              sleep 2
            done
            if [[ "$ready" != 1 ]]; then
              docker compose ps
              docker compose logs --no-color api research ml engine collector
              exit 1
            fi
            cat /tmp/health.json
          done

      - name: Verify backend readiness contract
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --silent --output /tmp/ready.json --write-out '%{http_code}' http://127.0.0.1:4100/ready)
          test "$status" = 200 || test "$status" = 503
          grep -q '"marketData"' /tmp/ready.json
          cat /tmp/ready.json

      - name: Print service diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color --tail=120 api research ml collector engine

      - name: Stop service graph
        if: always()
        run: docker compose --profile local down -v
