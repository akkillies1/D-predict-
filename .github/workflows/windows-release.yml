name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.0'
        required: true
        default: '0.1.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'installer/D-predict.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'installer/dist/D-Predict Installer.exe')) { throw 'Installer executable was not produced.' }

      - name: Determine release tag
        id: release
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v${{ github.event.inputs.version }}'
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release and upload installer
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag 'installer/dist/D-Predict Installer.exe' --clobber
          } else {
            gh release create $tag 'installer/dist/D-Predict Installer.exe' --title "D-Predict $tag" --generate-notes
          }
