name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.1.8.1'
        required: true
        default: '0.1.8.1'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Determine release tag
        id: release
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v${{ github.event.inputs.version }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $tag"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DMyAppVersion=${{ steps.release.outputs.version }}' 'installer/D-predict.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versioned = "installer/dist/D-Predict-Setup-v${{ steps.release.outputs.version }}.exe"
          if (-not (Test-Path $versioned)) { throw "Versioned installer was not produced: $versioned" }
          Copy-Item $versioned 'installer/dist/D-Predict-Setup.exe' -Force

      - name: Create GitHub release and upload installers
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $versioned = 'installer/dist/D-Predict-Setup-v${{ steps.release.outputs.version }}.exe'
          $stable = 'installer/dist/D-Predict-Setup.exe'
          $releaseExists = $false
          try {
            gh release view $tag *> $null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            gh release upload $tag $versioned $stable --clobber
          } else {
            gh release create $tag $versioned $stable --title "D-Predict $tag" --generate-notes
          }
