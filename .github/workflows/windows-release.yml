name: Windows Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 2.1.0'
        required: true
        default: '2.1.0'
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
            $sourceRef = $tag
          } else {
            $tag = 'v${{ github.event.inputs.version }}'
            $sourceRef = '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+(\.\d+){2,3}$') {
            throw "Invalid release tag: $tag. Expected semantic version such as v2.0.0"
          }
          $version = $tag.Substring(1)
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "sourceRef=$sourceRef" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Validate dashboard lockfile
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --dir dashboard install --frozen-lockfile --ignore-scripts

      - name: Compile installer
        shell: powershell
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' '/DMyAppVersion=${{ steps.release.outputs.version }}' '/DMyAppSourceRef=${{ steps.release.outputs.sourceRef }}' 'installer/D-predict.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $versioned = "installer/dist/D-Predict-Setup-v${{ steps.release.outputs.version }}.exe"
          if (-not (Test-Path $versioned)) { throw "Versioned installer was not produced: $versioned" }
          Copy-Item $versioned 'installer/dist/D-Predict-Setup.exe' -Force

      - name: Package script-based Windows install bundle
        shell: powershell
        run: |
          $version = '${{ steps.release.outputs.version }}'
          $stage = Join-Path $env:RUNNER_TEMP "D-Predict-Windows-v$version"
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $files = @(
            'install-dpredict.ps1',
            'bootstrap-windows.ps1',
            'database-setup.ps1',
            'dp.ps1',
            'run.ps1',
            'launch-dpredict.ps1',
            'd-predict.ps1',
            'stop-d-predict.ps1',
            'docker-compose.yml',
            '.env.example',
            'README.md',
            'LOCAL_INSTALL_GUIDE.md',
            'WINDOWS.md'
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing script bundle input: $file" }
            Copy-Item $file (Join-Path $stage (Split-Path $file -Leaf)) -Force
          }
          $readme = @(
            'D-Predict Windows script-based installation',
            '',
            '1. Extract this ZIP to a folder you control.',
            '2. Open PowerShell in that folder and inspect install-dpredict.ps1.',
            '3. Run:',
            '   powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install-dpredict.ps1',
            '4. Complete the database setup prompt.',
            '5. Start with .\launch-dpredict.ps1 or the Start Menu shortcut created by setup.',
            '',
            'This path avoids launching the unsigned Inno Setup EXE. It does not disable or bypass Smart App Control; Windows may still enforce script policy or block child executables.'
          ) -join "`r`n"
          Set-Content -Path (Join-Path $stage 'README-Windows-Script-Install.txt') -Value $readme -Encoding UTF8
          $bundle = "installer/dist/D-Predict-Windows-v$version.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $bundle -CompressionLevel Optimal -Force
          if (-not (Test-Path $bundle)) { throw "Script bundle was not produced: $bundle" }

      - name: Create GitHub release and upload installers
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.release.outputs.tag }}'
          $versioned = 'installer/dist/D-Predict-Setup-v${{ steps.release.outputs.version }}.exe'
          $stable = 'installer/dist/D-Predict-Setup.exe'
          $scriptBundle = 'installer/dist/D-Predict-Windows-v${{ steps.release.outputs.version }}.zip'
          $releaseExists = $false
          try {
            gh release view $tag *> $null
            $releaseExists = ($LASTEXITCODE -eq 0)
          } catch {
            $releaseExists = $false
          }

          if ($releaseExists) {
            # Retarget an existing release when rebuilding it from the current source ref.
            gh release edit $tag --target '${{ steps.release.outputs.sourceRef }}'
            gh release upload $tag $versioned $stable $scriptBundle --clobber
          } else {
            gh release create $tag --target '${{ steps.release.outputs.sourceRef }}' $versioned $stable $scriptBundle --title "D-Predict $tag" --generate-notes
          }
