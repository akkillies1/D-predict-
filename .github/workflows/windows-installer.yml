name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'installer/**'
      - 'install-dpredict.ps1'
      - 'database-setup.ps1'
      - 'bootstrap-windows.ps1'
      - 'bootstrap-ui.ps1'
      - 'dp.ps1'
      - 'run.ps1'
      - 'launch-dpredict.ps1'
      - '.github/workflows/windows-installer.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'install-dpredict.ps1'
      - 'bootstrap-windows.ps1'
      - 'dp.ps1'
      - 'run.ps1'
      - 'launch-dpredict.ps1'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    env:
      INSTALLER_VERSION: '2.1.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress

      - name: Validate installer inputs
        shell: powershell
        run: |
          $required = @(
            'installer/D-predict.iss',
            'install-dpredict.ps1',
            'bootstrap-windows.ps1',
            'bootstrap-ui.ps1',
            'dp.ps1',
            'run.ps1',
            'launch-dpredict.ps1',
            'database-setup.ps1',
            '.env.example',
            'docker-compose.yml'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing installer input: $file" }
          }

      - name: Validate PowerShell installer scripts
        shell: powershell
        run: |
          $scripts = @('install-dpredict.ps1','database-setup.ps1','bootstrap-windows.ps1')
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.ToString() }
              throw "PowerShell parse validation failed: $script"
            }
          }

      - name: Validate dashboard lockfile
        shell: powershell
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          pnpm --dir dashboard install --frozen-lockfile --ignore-scripts

      - name: Compile installer
        shell: powershell
        run: |
          $version = $env:INSTALLER_VERSION
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' "/DMyAppVersion=$version" 'installer/D-predict.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "installer/dist/D-Predict-Setup-v$version.exe"
          if (-not (Test-Path $installer)) { throw "Installer executable was not produced: $installer" }
          Get-Item $installer | Format-List FullName,Length,LastWriteTime

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: D-Predict Installer v${{ env.INSTALLER_VERSION }}
          path: 'installer/dist/D-Predict-Setup-v${{ env.INSTALLER_VERSION }}.exe'
          if-no-files-found: error
          retention-days: 30
