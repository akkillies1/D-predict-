name: D-predict CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Backend install and test
        run: npm ci --prefix backend && npm test --prefix backend
      - name: Dashboard install and typecheck/build
        run: npm ci --legacy-peer-deps --prefix dashboard && npm run check --prefix dashboard && npm run build --prefix dashboard
      - name: Collector dependency install and compile check
        run: python -m pip install -r collector/requirements.txt && python -m compileall -q collector
      - name: Training source compile check
        run: python -m compileall -q training
      - name: Package source snapshot
        run: git archive --format=zip --output=d-predict-source.zip HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: d-predict-source
          path: d-predict-source.zip
          retention-days: 1
